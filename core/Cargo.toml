[package]
name = "dologger-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DoLogger: Cross-platform, high-security, plugin-based logging engine"

[lib]
name = "dologger_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
toml = "0.8"
flatbuffers = "25"
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
libloading = "0.9"
aes-gcm = "0.10"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
ureq = { version = "2", optional = true }
rskafka = { version = "0.6", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"], optional = true }
chrono = { version = "0.4", optional = true }

[features]
default = []
sink-sqlite = ["rusqlite"]
sink-webhook = ["ureq"]
sink-otel = ["ureq"]
sink-kafka = ["rskafka", "tokio", "chrono"]

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
ed25519-dalek = "2"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "latency_percentiles"
harness = false

[[bench]]
name = "shm_write_latency"
harness = false
