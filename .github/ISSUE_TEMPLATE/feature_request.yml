name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve for you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should DoLogger address it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have thought about.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core engine
        - dologctl CLI
        - Plugin system
        - Language adapter
        - Documentation
        - CI / tooling
    validations:
      required: true
