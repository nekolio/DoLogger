name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

# Releases must never be torn down mid-publish — cancel-in-progress: false
# only dedupes overlapping runs of the SAME tag, letting both finish whole.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Tests (run on all platforms before releasing) ─────────────────
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      # No rustfmt/clippy here — this job only runs tests (CI owns linting).
      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-release

      # Match the CI workflow's proven command — NOT --all-targets: criterion
      # benches would run as tests and take 20+ minutes on CI Windows.
      - name: Cargo test (lib + integration + doc)
        run: cargo test --workspace -- --test-threads=4

      # filter_level plugin uses global statics — must run single-threaded
      - name: Cargo test (filter_level — serial)
        run: cargo test -p dologger-plugin-filter-level -- --test-threads=1

      - name: Cargo test with all features (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p dologger-core --all-features

  # ── Build release artifacts (parallel with tests/benchmarks — the
  #    create-release job is the gate that requires all three) ──────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target ships its CLI binary AND its core library. Each
          # core library gets a per-target asset name: download-artifact
          # merges all jobs' files into one directory, and five Linux jobs
          # all building libdologger_core.so would otherwise overwrite each
          # other (only the last one would survive in the release).
          #
          # Asset names embed the tag (`dologctl-v0.2.0-linux-x86_64`):
          # github.ref_name is the pushed tag, so every version's assets
          # carry its version and the site can match them by suffix.
          # (v0.1.0's published assets predate this and stay unversioned —
          # the site's matcher accepts both schemes.)
          #
          # ── Linux ───────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-linux-x86_64
            lib_name: libdologger_core.so
            lib_asset_name: libdologger_core-${{ github.ref_name }}-linux-x86_64.so

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-linux-aarch64
            lib_name: libdologger_core.so
            lib_asset_name: libdologger_core-${{ github.ref_name }}-linux-aarch64.so

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-linux-i686
            lib_name: libdologger_core.so
            lib_asset_name: libdologger_core-${{ github.ref_name }}-linux-i686.so

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-linux-armv7
            lib_name: libdologger_core.so
            lib_asset_name: libdologger_core-${{ github.ref_name }}-linux-armv7.so

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-linux-riscv64
            lib_name: libdologger_core.so
            lib_asset_name: libdologger_core-${{ github.ref_name }}-linux-riscv64.so

          # ── Windows ─────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dologctl.exe
            # Windows binaries keep the .exe extension; Linux/macOS
            # binaries are conventionally extension-less.
            asset_name: dologctl-${{ github.ref_name }}-windows-x86_64.exe
            lib_name: dologger_core.dll
            lib_asset_name: dologger_core-${{ github.ref_name }}-windows-x86_64.dll

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: dologctl.exe
            asset_name: dologctl-${{ github.ref_name }}-windows-aarch64.exe
            lib_name: dologger_core.dll
            lib_asset_name: dologger_core-${{ github.ref_name }}-windows-aarch64.dll

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: dologctl.exe
            asset_name: dologctl-${{ github.ref_name }}-windows-i686.exe
            lib_name: dologger_core.dll
            lib_asset_name: dologger_core-${{ github.ref_name }}-windows-i686.dll

          # ── macOS ───────────────────────────────────────────────
          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-macos-aarch64
            lib_name: libdologger_core.dylib
            lib_asset_name: libdologger_core-${{ github.ref_name }}-macos-aarch64.dylib

          - os: macOS-latest
            target: x86_64-apple-darwin
            artifact: dologctl
            asset_name: dologctl-${{ github.ref_name }}-macos-x86_64
            lib_name: libdologger_core.dylib
            lib_asset_name: libdologger_core-${{ github.ref_name }}-macos-x86_64.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      # Cross toolchain for this matrix entry only. Native x86_64 builds
      # need none of these; Windows/macOS don't use them. Installing all
      # cross compilers in one step would conflict on Ubuntu 24.04
      # (gcc-multilib and gcc-aarch64-linux-gnu cannot coexist), so each
      # job installs just the one it needs.
      - name: Install cross-compilation toolchains (Linux)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              PACKAGES="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" ;;
            i686-unknown-linux-gnu)
              PACKAGES="gcc-i686-linux-gnu g++-i686-linux-gnu" ;;
            armv7-unknown-linux-gnueabihf)
              PACKAGES="gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" ;;
            riscv64gc-unknown-linux-gnu)
              PACKAGES="gcc-riscv64-linux-gnu g++-riscv64-linux-gnu" ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y $PACKAGES

      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-release

      # librdkafka (sink-kafka) is only buildable natively on Linux x86_64 —
      # it cannot cross-compile for the other Linux targets and is
      # unavailable on macOS/Windows.
      - name: Build release (Linux x86_64 — all features incl. Kafka)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} --all-features

      # Other targets build with sqlite/webhook (pure-Rust or cc-based
      # dependencies that cross-compile cleanly). The per-target linkers
      # below are only consulted when cargo actually builds that target.
      - name: Build release (other targets — sqlite/webhook, without kafka)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
          CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
          CXX_i686_unknown_linux_gnu: i686-linux-gnu-g++
          AR_i686_unknown_linux_gnu: i686-linux-gnu-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} \
            --features dologger-core/sink-sqlite,dologger-core/sink-webhook

      - name: Prepare CLI binary artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "release-artifacts/${{ matrix.asset_name }}"

      - name: Prepare core library artifact
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
               "release-artifacts/${{ matrix.lib_asset_name }}"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_name }}
          path: release-artifacts/*
          if-no-files-found: warn

  # ── Benchmarks (per-release, live results; parallel with tests) ──
  benchmarks:
    name: Benchmarks (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmarks-release

      - name: Build release
        run: cargo build --release --workspace

      - name: Run benchmarks and assemble results
        shell: bash
        run: |
          strip_ansi() { sed 's/\x1b\[[0-9;]*m//g'; }

          # dologctl perf: full output (throughput + P50/P99/P99.9).
          # Criterion in bencher format: one clean `test <name> ... bench:`
          # line per benchmark — no ANSI, no truncated report boxes.
          PERF_OUT="$(./target/release/dologctl perf --count 200000 2>&1 | strip_ansi || true)"

          # Start from a clean criterion state: rust-cache restores stale
          # target/criterion samples from earlier runs, and a release notes
          # benchmark should only reflect this run. Criterion can also emit a
          # mid-line `Criterion.rs ERROR: ...` when its sample file races the
          # cache restore; strip that text so the bencher line survives.
          rm -rf target/criterion
          CRIT_RAW="$(cargo bench --bench latency --bench throughput -- --output-format bencher 2>&1 | strip_ansi || true)"
          CRIT_OUT="$(printf '%s\n' "$CRIT_RAW" | sed -z 's/ Criterion\.rs ERROR: [^\n]*\n/ /g' | grep -E '^test .*bench:' || true)"
          if [ -z "$CRIT_OUT" ]; then
            echo "::warning::cargo bench produced no bencher lines — raw output tail:"
            printf '%s\n' "$CRIT_RAW" | tail -30
          fi

          # Localized copies for the Chinese block. The CLI and criterion
          # print fixed English labels; translating them here in shell keeps
          # the source output untouched. Each pattern consumes the label AND
          # its original padding, and the replacement re-pads for the Chinese
          # label's display width (CJK chars count 2 columns) so the value
          # columns keep their original alignment. Criterion's own output is
          # not column-aligned across lines, so those four lines are padded
          # to one common value column instead.
          PERF_ZH="$(printf '%s\n' "$PERF_OUT" | sed \
            -e 's/DoLogger Performance Benchmark/DoLogger 性能跑分/' \
            -e 's/^  Records:       /  记录数:        /' \
            -e 's/^  Message size:  /  消息大小:      /' \
            -e 's/ bytes/ 字节/' \
            -e 's/^  Ring buffer:   /  环形缓冲:      /' \
            -e 's/ slots (\([0-9]*\) KiB)/ 槽位（\1 KiB）/' \
            -e 's/Warming up (\([0-9 ]*\) records)\.\.\./预热中（\1 条记录）.../' \
            -e 's/  Warm-up P50: /  预热 P50:  /' \
            -e 's/Benchmarking (\([0-9]*\) records)\.\.\./跑分中（\1 条记录）.../' \
            -e 's/^Results$/结果/' \
            -e 's/^  Total time:       /  总耗时:        /' \
            -e 's/^  Records pushed:   /  已压入记录:      /' \
            -e 's/rec\/s/条\/秒/' \
            -e 's/^  Throughput:       /  吞吐:           /' \
            -e 's/Submit Latency (push → ring buffer)/提交延迟（压入 → 环形缓冲）/' \
            -e 's/\([0-9.]*\) ns/\1 纳秒/g' \
            -e 's/\([0-9.]*\) µs/\1 微秒/g' \
            -e 's/\([0-9.]*\) ms/\1 毫秒/g' \
            -e 's/\([0-9.]*\) s$/\1 秒/' \
            -e 's/ Min:/ 最小:/' \
            -e 's/ Max:/ 最大:/' \
            -e 's/ Avg:/ 平均:/')"
          CRIT_ZH="$(printf '%s\n' "$CRIT_OUT" | sed \
            -e 's/^test single_record_submit ... bench:/测试 单条记录提交 ... 耗时:             /' \
            -e 's/^test single_record_submit_with_sign ... bench:/测试 单条记录提交（带签名） ... 耗时:   /' \
            -e 's/^test ring_buffer_push_1k ... bench:/测试 环形缓冲压入 1K ... 耗时:          /' \
            -e 's/^test ring_buffer_push_batch_256 ... bench:/测试 环形缓冲批量压入 256 ... 耗时:     /' \
            -e 's/ ns\/iter/ 纳秒\/次/' \
            -e 's/(+\/-/（±/' \
            -e 's/)$/）/')"

          CPU_MODEL="$(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"
          MEM_TOTAL="$(free -h | awk '/^Mem:/ {print $2}')"
          OS_VER="$(uname -sr)"
          RUST_VER="$(rustc --version)"

          cat > benchmark-results.md <<EOF
          <!--BENCH_EN-->
          **Benchmarks**

          Measured on the GitHub Actions runner (\`ubuntu-latest\`) from this exact build: the runner compiles the code and then benchmarks that binary on the same machine.

          | Item | Value |
          |:-:|:-:|
          | OS | ${OS_VER} |
          | CPU | ${CPU_MODEL} |
          | Memory | ${MEM_TOTAL} |
          | Rust | ${RUST_VER} |
          | Build | release + LTO |

          **Submit latency and throughput** — \`dologctl perf --count 200000\`:

          \`\`\`text
          ${PERF_OUT:-<dologctl perf failed on this runner>}
          \`\`\`

          **Single-record latency (Criterion)** — \`cargo bench --bench latency --bench throughput\`:

          \`\`\`text
          ${CRIT_OUT:-<criterion benchmarks failed on this runner>}
          \`\`\`
          <!--BENCH_ZH-->
          **跑分结果**

          以下数据由 GitHub Actions 运行器（\`ubuntu-latest\`）在本次发布构建上现场测得：运行器先编译代码，再在同一台机器上对产物跑分。

          | 项目 | 值 |
          |:-:|:-:|
          | 系统 | ${OS_VER} |
          | CPU | ${CPU_MODEL} |
          | 内存 | ${MEM_TOTAL} |
          | Rust | ${RUST_VER} |
          | 构建 | release + LTO |

          **提交延迟与吞吐** —— \`dologctl perf --count 200000\`：

          \`\`\`text
          ${PERF_ZH:-<本次运行器上 dologctl perf 失败>}
          \`\`\`

          **单条记录延迟（Criterion）** —— \`cargo bench --bench latency --bench throughput\`：

          \`\`\`text
          ${CRIT_ZH:-<本次运行器上 criterion 跑分失败>}
          \`\`\`
          EOF

          # The heredoc above is indented for YAML; dedent the output.
          sed -i 's/^          //' benchmark-results.md
          cat benchmark-results.md

          # Machine-readable copy for the site (scripts/build-site.sh
          # downloads this release asset server-side — browsers cannot fetch
          # release assets due to CORS). Same numbers as the markdown:
          # perf --output json is the CLI's own JSON emitter; criterion is
          # parsed from CRIT_OUT with the same bencher regex bench.yml uses.
          PERF_JSON="$(./target/release/dologctl perf --count 200000 --output json 2>/dev/null || echo '{}')"
          CRIT_JSON="$(CRIT_OUT="$CRIT_OUT" python3 - <<'PY'
          import json, os, re
          lines = os.environ.get('CRIT_OUT', '').splitlines()
          crit = {}
          for line in lines:
              m = re.match(r'^test\s+(\S+)\s+\.\.\.\s+bench:\s+([\d,\.]+)\s+(\S+)', line)
              if m:
                  crit[m.group(1)] = {
                      'value': float(m.group(2).replace(',', '')),
                      'unit': m.group(3).replace('/iter', ''),
                  }
          print(json.dumps(crit, ensure_ascii=False))
          PY
          )"
          cat > benchmark-results.json <<EOF
          {
            "tag": "${GITHUB_REF_NAME}",
            "os": "${OS_VER}",
            "cpu": "${CPU_MODEL}",
            "memory": "${MEM_TOTAL}",
            "rust": "${RUST_VER}",
            "build": "release + LTO",
            "perf": ${PERF_JSON},
            "criterion": ${CRIT_JSON}
          }
          EOF
          sed -i 's/^          //' benchmark-results.json
          python3 -m json.tool benchmark-results.json > /dev/null \
            && echo "benchmark-results.json OK" || echo "::warning::invalid benchmark-results.json"
          cat benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results.md
            benchmark-results.json
          if-no-files-found: error

  # ── Create GitHub Release ────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [test, build, benchmarks]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      # Benchmark results are notes content, not release assets — keep them
      # out of release-artifacts/ (that directory is attached to the release).
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          path: bench
          pattern: benchmark-results
          merge-multiple: true

      # The machine-readable benchmark-results.json DOES ship as a release
      # asset: scripts/build-site.sh downloads it server-side when the site
      # is built (browsers cannot fetch release assets — CORS). Copied in
      # before checksums so it is covered by checksums-sha256.txt too.
      - name: Add benchmark JSON to release assets
        run: |
          cp bench/benchmark-results.json release-artifacts/benchmark-results.json

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > checksums-sha256.txt

      # Release notes: bilingual changelog (commit list) + usage + naming +
      # verification, with the benchmark sections merged in from the
      # benchmarks job (English block → <!--BENCH_EN-->, Chinese block →
      # <!--BENCH_ZH-->).
      - name: Generate release notes
        shell: bash
        run: |
          bash scripts/gen-release-notes.sh "${{ github.ref_name }}" > release-notes.md

      - name: Merge benchmark results into release notes
        shell: bash
        run: |
          python3 - release-notes.md bench/benchmark-results.md <<'PY'
          import sys
          notes_path, bench_path = sys.argv[1], sys.argv[2]
          with open(notes_path, encoding='utf-8') as f:
              body = f.read()
          with open(bench_path, encoding='utf-8') as f:
              section = f.read()
          en = section.split('<!--BENCH_EN-->', 1)[1].split('<!--BENCH_ZH-->', 1)[0]
          zh = section.split('<!--BENCH_ZH-->', 1)[1]
          body = body.replace('<!--BENCH_EN-->', en.strip())
          body = body.replace('<!--BENCH_ZH-->', zh.strip())
          with open(notes_path, 'w', encoding='utf-8', newline='\n') as f:
              f.write(body)
          PY
          echo "---- release-notes.md (head) ----"
          head -30 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: DoLogger ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*
          draft: false
          # All versions before 1.0.0 are pre-releases.
          # After 1.0.0, only -rc/-alpha/-beta/-pre suffixes trigger pre-release.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-pre') }}
          generate_release_notes: false

      # Site refresh chain (acyclic — cannot loop):
      #   tag push → release.yml → this dispatch → pages.yml → deploy
      # repository_dispatch is the one event a GITHUB_TOKEN API call CAN
      # trigger (documented); pages.yml itself never pushes. Fired only
      # after the release exists (if: success()) so the site's data layer
      # bakes the new release + its benchmark-results.json, never a stale
      # tag (benchmarks run 20+ min, so pages.yml must NOT trigger on tags).
      - name: Refresh GitHub Pages site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/dispatches \
          -f event_type=pages-update \
          -f "client_payload[tag]=${{ github.ref_name }}"
