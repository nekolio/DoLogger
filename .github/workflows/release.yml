name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tests (run on all platforms before releasing) ─────────────────
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-release

      # Match the CI workflow's proven command — NOT --all-targets: criterion
      # benches would run as tests and take 20+ minutes on CI Windows.
      - name: Cargo test (lib + integration + doc)
        run: cargo test --workspace -- --test-threads=4

      # filter_level plugin uses global statics — must run single-threaded
      - name: Cargo test (filter_level — serial)
        run: cargo test -p dologger-plugin-filter-level -- --test-threads=1

      - name: Cargo test with all features (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p dologger-core --all-features

  # ── Build release artifacts (parallel with tests/benchmarks — the
  #    create-release job is the gate that requires all three) ──────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ───────────────────────────────────────────────
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-x86_64
            lib_name: libdologger_core.so

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-aarch64
            lib_name: libdologger_core.so

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-i686
            lib_name: libdologger_core.so

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            artifact: dologctl
            asset_name: dologctl-linux-armv7
            lib_name: libdologger_core.so

          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-riscv64
            lib_name: libdologger_core.so

          # ── Windows ─────────────────────────────────────────────
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dologctl.exe
            # Windows binaries keep the .exe extension; Linux/macOS
            # binaries are conventionally extension-less.
            asset_name: dologctl-windows-x86_64.exe
            lib_name: dologger_core.dll

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: dologctl.exe
            asset_name: dologctl-windows-aarch64.exe
            lib_name: dologger_core.dll

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: dologctl.exe
            asset_name: dologctl-windows-i686.exe
            lib_name: dologger_core.dll

          # ── macOS ───────────────────────────────────────────────
          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact: dologctl
            asset_name: dologctl-macos-aarch64
            lib_name: libdologger_core.dylib

          - os: macOS-latest
            target: x86_64-apple-darwin
            artifact: dologctl
            asset_name: dologctl-macos-x86_64
            lib_name: libdologger_core.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      # Cross toolchain for this matrix entry only. Native x86_64 builds
      # need none of these; Windows/macOS don't use them. Installing all
      # cross compilers in one step would conflict on Ubuntu 24.04
      # (gcc-multilib and gcc-aarch64-linux-gnu cannot coexist), so each
      # job installs just the one it needs.
      - name: Install cross-compilation toolchains (Linux)
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              PACKAGES="gcc-aarch64-linux-gnu g++-aarch64-linux-gnu" ;;
            i686-unknown-linux-gnu)
              PACKAGES="gcc-i686-linux-gnu g++-i686-linux-gnu" ;;
            armv7-unknown-linux-gnueabihf)
              PACKAGES="gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf" ;;
            riscv64gc-unknown-linux-gnu)
              PACKAGES="gcc-riscv64-linux-gnu g++-riscv64-linux-gnu" ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y $PACKAGES

      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-release

      # librdkafka (sink-kafka) is only buildable natively on Linux x86_64 —
      # it cannot cross-compile for the other Linux targets and is
      # unavailable on macOS/Windows.
      - name: Build release (Linux x86_64 — all features incl. Kafka)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} --all-features

      # Other targets build with sqlite/webhook (pure-Rust or cc-based
      # dependencies that cross-compile cleanly). The per-target linkers
      # below are only consulted when cargo actually builds that target.
      - name: Build release (other targets — sqlite/webhook, without kafka)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: i686-linux-gnu-gcc
          CC_i686_unknown_linux_gnu: i686-linux-gnu-gcc
          CXX_i686_unknown_linux_gnu: i686-linux-gnu-g++
          AR_i686_unknown_linux_gnu: i686-linux-gnu-ar
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
          AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} \
            --features dologger-core/sink-sqlite,dologger-core/sink-webhook

      - name: Prepare CLI binary artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "release-artifacts/${{ matrix.asset_name }}"

      - name: Prepare core library artifact
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
               "release-artifacts/"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_name }}
          path: release-artifacts/*
          if-no-files-found: warn

  # ── Benchmarks (per-release, live results; parallel with tests) ──
  benchmarks:
    name: Benchmarks (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Setup Rust toolchain (latest stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmarks-release

      - name: Build release
        run: cargo build --release --workspace

      - name: Run benchmarks and assemble results
        shell: bash
        run: |
          strip_ansi() { sed 's/\x1b\[[0-9;]*m//g'; }

          # dologctl perf: full output (throughput + P50/P99/P99.9).
          # Criterion in bencher format: one clean `test <name> ... bench:`
          # line per benchmark — no ANSI, no truncated report boxes.
          PERF_OUT="$(./target/release/dologctl perf --count 200000 2>&1 | strip_ansi || true)"
          CRIT_OUT="$(cargo bench --bench latency --bench throughput -- --output-format bencher 2>&1 | strip_ansi | grep -E '^test .*bench:' || true)"

          CPU_MODEL="$(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"
          MEM_TOTAL="$(free -h | awk '/^Mem:/ {print $2}')"
          OS_VER="$(uname -sr)"
          RUST_VER="$(rustc --version)"

          cat > benchmark-results.md <<EOF
          <!--BENCH_EN-->
          **Benchmarks**

          Measured on the GitHub Actions runner (\`ubuntu-latest\`) from this exact build: the runner compiles the code and then benchmarks that binary on the same machine.

          | Item | Value |
          |:-:|:-:|
          | OS | ${OS_VER} |
          | CPU | ${CPU_MODEL} |
          | Memory | ${MEM_TOTAL} |
          | Rust | ${RUST_VER} |
          | Build | release + LTO |

          **Submit latency and throughput** — \`dologctl perf --count 200000\`:

          \`\`\`text
          ${PERF_OUT:-<dologctl perf failed on this runner>}
          \`\`\`

          **Single-record latency (Criterion)** — \`cargo bench --bench latency --bench throughput\`:

          \`\`\`text
          ${CRIT_OUT:-<criterion benchmarks failed on this runner>}
          \`\`\`
          <!--BENCH_ZH-->
          **跑分结果**

          以下数据由 GitHub Actions 运行器（\`ubuntu-latest\`）在本次发布构建上现场测得：运行器先编译代码，再在同一台机器上对产物跑分。

          | 项目 | 值 |
          |:-:|:-:|
          | 系统 | ${OS_VER} |
          | CPU | ${CPU_MODEL} |
          | 内存 | ${MEM_TOTAL} |
          | Rust | ${RUST_VER} |
          | 构建 | release + LTO |

          **提交延迟与吞吐** —— \`dologctl perf --count 200000\`：

          \`\`\`text
          ${PERF_OUT:-<本次运行器上 dologctl perf 失败>}
          \`\`\`

          **单条记录延迟（Criterion）** —— \`cargo bench --bench latency --bench throughput\`：

          \`\`\`text
          ${CRIT_OUT:-<本次运行器上 criterion 跑分失败>}
          \`\`\`
          EOF

          # The heredoc above is indented for YAML; dedent the output.
          sed -i 's/^          //' benchmark-results.md
          cat benchmark-results.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.md
          if-no-files-found: error

  # ── Create GitHub Release ────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [test, build, benchmarks]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      # Benchmark results are notes content, not release assets — keep them
      # out of release-artifacts/ (that directory is attached to the release).
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          path: bench
          pattern: benchmark-results
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > checksums-sha256.txt

      # Release notes: bilingual changelog (commit list) + usage + naming +
      # verification, with the benchmark sections merged in from the
      # benchmarks job (English block → <!--BENCH_EN-->, Chinese block →
      # <!--BENCH_ZH-->).
      - name: Generate release notes
        shell: bash
        run: |
          bash scripts/gen-release-notes.sh "${{ github.ref_name }}" > release-notes.md

      - name: Merge benchmark results into release notes
        shell: bash
        run: |
          python3 - release-notes.md bench/benchmark-results.md <<'PY'
          import sys
          notes_path, bench_path = sys.argv[1], sys.argv[2]
          with open(notes_path, encoding='utf-8') as f:
              body = f.read()
          with open(bench_path, encoding='utf-8') as f:
              section = f.read()
          en = section.split('<!--BENCH_EN-->', 1)[1].split('<!--BENCH_ZH-->', 1)[0]
          zh = section.split('<!--BENCH_ZH-->', 1)[1]
          body = body.replace('<!--BENCH_EN-->', en.strip())
          body = body.replace('<!--BENCH_ZH-->', zh.strip())
          with open(notes_path, 'w', encoding='utf-8', newline='\n') as f:
              f.write(body)
          PY
          echo "---- release-notes.md (head) ----"
          head -30 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: DoLogger ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*
          draft: false
          # All versions before 1.0.0 are pre-releases.
          # After 1.0.0, only -rc/-alpha/-beta/-pre suffixes trigger pre-release.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-pre') }}
          generate_release_notes: false
