name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tests (run on all platforms before releasing) ─────────────────
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-release

      - name: Cargo test (all targets)
        run: cargo test --workspace --all-targets

      - name: Cargo test with all features (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p dologger-core --all-features

  # ── Build release artifacts ──────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-x86_64
            lib_name: libdologger_core.so

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: dologctl
            asset_name: dologctl-linux-aarch64
            lib_name: libdologger_core.so

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: dologctl.exe
            asset_name: dologctl-windows-x86_64
            lib_name: dologger_core.dll

          - os: macOS-latest
            target: aarch64-apple-darwin
            artifact: dologctl
            asset_name: dologctl-macos-aarch64
            lib_name: libdologger_core.dylib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-release

      - name: Build release (Linux — all features)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} --all-features

      - name: Build release (macOS / Windows — without kafka)
        if: runner.os != 'Linux'
        run: |
          cargo build --release --workspace --target ${{ matrix.target }} \
            --features sink-sqlite,sink-webhook,sink-otel

      - name: Prepare CLI binary artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "release-artifacts/${{ matrix.asset_name }}"

      - name: Prepare core library artifact
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.lib_name }}" \
               "release-artifacts/"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_name }}
          path: release-artifacts/*
          if-no-files-found: warn

  # ── Create GitHub Release ────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > checksums-sha256.txt

      # Release notes: changelog sections (EN + ZH) + commit list since the
      # previous tag + usage + asset naming conventions + verification notes.
      - name: Generate release notes
        shell: bash
        run: |
          bash scripts/gen-release-notes.sh "${{ github.ref_name }}" > release-notes.md
          echo "---- release-notes.md ----"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DoLogger ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-artifacts/*
          draft: false
          # All versions before 1.0.0 are pre-releases.
          # After 1.0.0, only -rc/-alpha/-beta/-pre suffixes trigger pre-release.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-pre') }}
          generate_release_notes: false
