name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Tests (runs in parallel with lint) ───────────────────────────
  test:
    name: ${{ matrix.os }} / test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is required by the librdkafka source build
          sudo apt-get install -y cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-test

      - name: Cargo test (lib + integration + doc)
        run: cargo test --workspace -- --test-threads=4

      # filter_level plugin uses global statics — must run single-threaded
      - name: Cargo test (filter_level — serial)
        run: cargo test -p dologger-plugin-filter-level -- --test-threads=1

      # ── Feature flag testing ──────────────────────────────────────
      # Test the sink-kafka feature on Linux only (librdkafka source build
      # needs cmake, libssl, libsasl2 and libcurl — installed above).
      - name: Cargo test with sink-kafka feature (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p dologger-core --features sink-kafka

      - name: Cargo check all feature combinations (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo check -p dologger-core --no-default-features
          cargo check -p dologger-core --features sink-sqlite
          cargo check -p dologger-core --features sink-webhook
          cargo check -p dologger-core --features sink-kafka
          cargo check -p dologger-core --all-features

      - name: Cargo check all feature combinations (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo check -p dologger-core --no-default-features
          cargo check -p dologger-core --features sink-sqlite
          cargo check -p dologger-core --features sink-webhook

      - name: Cargo check all feature combinations (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo check -p dologger-core --no-default-features
          cargo check -p dologger-core --features sink-sqlite
          cargo check -p dologger-core --features sink-webhook

  # ── Lint (clippy per platform — each OS has distinct cfg paths; fmt is
  #    platform-independent and runs once) ───────────────────────────
  lint:
    name: ${{ matrix.os }} / lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-lint

      # clippy --all-targets already type-checks everything, so there is
      # no separate `cargo check` step here.
      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo fmt (check)
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

  # ── Cross-platform verification summary ──────────────────────────
  ci-summary:
    name: CI Summary
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report CI status
        run: |
          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.lint.result }}" == "success" ]]; then
            echo "✅ All platform builds and tests passed."
          else
            echo "❌ One or more platform builds failed."
            exit 1
          fi
