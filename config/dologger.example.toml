# DoLogger Configuration — Example with all available options
#
# Copy this file to dologger.toml and customize for your environment.
# dologger.toml is gitignored — never commit local configs.
#
# Valid performance profiles:
#   dev              — Debug logging, small batches, signatures off
#   prod-performance — Maximum throughput, cooperative helping, yield backoff
#   prod-audit       — All records signed, WORM storage, fsync on every write
#   balanced         — Compromise between throughput and safety

[dologger]
# Log level: TRACE, DEBUG, INFO, WARN, ERROR, FATAL
level = "INFO"

# Performance profile preset (see above)
performance_profile = "prod-performance"

# Ring buffer capacity — MUST be a power of two (e.g., 65536, 131072, 262144)
ring_buffer_size = 262144

# Number of records to drain per batch from the ring buffer
batch_size = 256

# Enable the opt-in isolated AUDIT pipeline.
enable_audit = false
# Add per-record Ed25519 signatures inside the AUDIT pipeline.
enable_signature = false

# Shutdown behavior: "graceful" (drain all pending) or "immediate" (drop pending)
shutdown_policy = "graceful"

# Maximum time to wait for drain during shutdown (milliseconds, 0 = no limit)
shutdown_timeout_ms = 5000

# Grace period after key rotation before old keys are fully revoked (days)
key_rotation_grace_period_days = 7

# Enable producer-thread cooperative helping when ring buffer reaches 90% capacity
ring_buffer_coop_helping = true

# Directory of the committed plugin trust store (active.pub + revoked.txt).
# When set, it is authoritative and plugin_trust_anchor is ignored.
# plugin_trust_store = "plugins/official/trust-anchors"

# Legacy single trust anchor — 64-hex Ed25519 public key (used when no store).
# plugin_trust_anchor = "<64 hex chars>"

# Allow unsigned (Red) plugins outside dev mode (not recommended).
plugin_allow_red_plugins = false

# ---------------------------------------------------------------------------
# Sinks — one [sinks.<name>] table per output destination. The `type` tag
# selects the backend; the remaining fields configure it. Unknown fields are
# rejected (a typo surfaces as a config error, not a silently ignored option).
#
# Multiple sinks are fanned out: every record is written to each configured
# sink (FanoutSink). When [sinks.*] is absent or empty, a default console sink
# to stdout is applied.
#
# Feature-gated backends (kafka / sqlite / webhook / otel) are constructible
# only when the matching Cargo feature is enabled at build time.
# ---------------------------------------------------------------------------

[sinks.stdout]
type = "console"
# use_stderr = true              # write to stderr instead of stdout

[sinks.applog]
type = "file"
path = "/var/log/dologger/app.log"
max_size = 104857600            # bytes; 0 = unlimited (100 MiB here)
durability_level = "os_cache"   # unsafe | os_cache | media | media_with_fua
fsync_on_write = false

[sinks.audit]
type = "worm"
path = "/var/log/dologger/audit.worm"
durability = "media_with_fua"   # os_cache | media | media_with_fua
max_size = 0                    # 0 = unlimited

[sinks.security]
type = "security"
path = "/var/log/dologger/security.log"

[sinks.remote]
type = "syslog"
host = "127.0.0.1"
port = 514
protocol = "udp"                # udp | tcp | tls
facility = "user"               # RFC 5424 facility code
app_name = "dologger"

# ---------------------------------------------------------------------------
# Shared memory sink (sink_shm) — optional, top-level table (NOT under [sinks.*])
# ---------------------------------------------------------------------------
# sink_shm delivers SIF records to external consumer processes through a
# zero-copy, cross-process shared-memory ring buffer. It is non-persistent
# (durability forced to UNSAFE) and is forbidden in AUDIT/signature mode.
# Remove or leave empty to disable.
[shm]
path = "/dologger_default.shm"   # POSIX name on Unix; mapping name on Windows
buffer_size_mb = 64              # power of two, >= 8
slot_size_kb = 64                # per-slot max, >= 64
full_policy = "drop_newest"      # drop_newest | drop_oldest
permissions = 0o660              # Unix only
auto_cleanup = true              # unlink the region on engine shutdown
allowed_consumers = []           # empty = allow all
