# =============================================================================
# DoLogger GDPR Compliance Template
# =============================================================================
#
# This template provides a starting configuration for environments that process
# personal data subject to the EU General Data Protection Regulation (GDPR)
# (Regulation (EU) 2016/679).
#
# IMPORTANT: This template is a technical starting point only. It does NOT
# guarantee GDPR compliance. You MUST consult your legal counsel and perform
# a full data protection impact assessment (DPIA, Art. 35) before deploying
# to production.
#
# How to validate:
#   dologctl config validate --config compliance/gdpr.toml --strict
#
# =============================================================================

[dologger]

# Performance profile: "prod-audit" enforces signed records and audit-level
# batch sizing. Required for maintaining non-repudiation of log entries.
# GDPR Art. 32 (security of processing) requires appropriate technical
# measures — signed audit trails provide evidence of data integrity.
performance_profile = "prod-audit"

# Log level: AUDIT captures all security-relevant events. Under GDPR,
# processing of personal data must be documented (Art. 30 records of
# processing activities).
level = "AUDIT"

# ---------------------------------------------------------------------------
# Non-downgradable Security Settings
# These items can only be tightened (false→true), never loosened.
# The template sets them to their most secure values for GDPR environments.
# ---------------------------------------------------------------------------

# enable_signature = true
# GDPR Rationale: Non-repudiation. Ed25519 signatures on every log record
# ensure that log entries cannot be altered or forged after writing. This
# supports Art. 5(1)(f) (integrity and confidentiality) and Art. 32
# (security of processing). Auditors must be able to trust the log chain.
enable_signature = true

# worm_enabled = true
# GDPR Rationale: Write-Once-Read-Many (WORM) storage prevents deletion or
# modification of audit records after they are committed. This is a key
# technical control for Art. 32, ensuring that processing records and
# evidence of compliance cannot be tampered with.
worm_enabled = true

# sign_ring2 = true
# GDPR Rationale: Ring 2 fields include user.id, session.id, and other
# personal data identifiers. Signing these fields binds the PII context
# to the log record, making it cryptographically verifiable which personal
# data was accessed and when — critical for data subject access requests
# (Art. 15) and breach notifications (Art. 33-34).
sign_ring2 = true

# escape_html = true
# GDPR Rationale: Data minimization and output sanitization (Art. 5(1)(c)
# and Art. 32). HTML-escaping prevents injection of malicious content into
# log output, reducing the risk of log-based XSS or data exfiltration that
# could expose personal data.
escape_html = true

# fsync_on_write = true
# GDPR Rationale: Data durability and integrity (Art. 5(1)(f), Art. 32).
# Forcing fsync on every write guarantees that audit records are physically
# committed to durable media before acknowledgement. In the event of a
# system crash, no audit gaps exist — this is essential for demonstrating
# compliance to supervisory authorities under Art. 58.
fsync_on_write = true

# require_tls = true
# GDPR Rationale: Protection of data in transit (Art. 32(1)(a) —
# encryption of personal data). All remote sink connections (syslog,
# webhook, OTEL exporter) must use TLS 1.2 or higher. Unencrypted
# transmission of personal data over networks is a GDPR violation.
require_tls = true

# Ring buffer size: 256K records provides a balance between memory use and
# loss-prevention during sink backpressure. Art. 32 requires resilience.
ring_buffer_size = 262144

# Batch size: 128 is the prod-audit default, balancing throughput with
# the overhead of per-batch signature operations.
batch_size = 128

# Shutdown policy: "graceful" ensures all in-flight records are drained
# before exit. GDPR accountability (Art. 5(2)) requires that no audit
# events are lost during controlled shutdown.
shutdown_policy = "graceful"
shutdown_timeout_ms = 10000
