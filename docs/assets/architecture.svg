<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00D4FF"/>
    </marker>
  </defs>

  <rect width="1040" height="560" fill="#0D1117"/>

  <!-- Application -->
  <rect x="24" y="212" width="152" height="136" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="100" y="246" font-size="15" font-weight="700" fill="#FF6B00" text-anchor="middle">APPLICATION</text>
  <text x="100" y="270" font-size="12" fill="#C9D1D9" text-anchor="middle">dologger_log()</text>
  <text x="100" y="288" font-size="11" fill="#8B949E" text-anchor="middle">Rust SDK · C ABI</text>
  <text x="100" y="304" font-size="11" fill="#8B949E" text-anchor="middle">Python · Go adapters</text>
  <text x="100" y="326" font-size="11" fill="#8B949E" text-anchor="middle">zero malloc on submit</text>

  <line x1="176" y1="280" x2="222" y2="280" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="199" y="266" font-size="10" fill="#8B949E" text-anchor="middle">push</text>

  <!-- Lock-free ring -->
  <rect x="228" y="212" width="196" height="136" fill="#161B22" stroke="#00D4FF" stroke-width="1"/>
  <text x="326" y="246" font-size="15" font-weight="700" fill="#00D4FF" text-anchor="middle">LOCK-FREE RING</text>
  <text x="326" y="270" font-size="12" fill="#C9D1D9" text-anchor="middle">MPSC · CAS push</text>
  <text x="326" y="288" font-size="11" fill="#8B949E" text-anchor="middle">normal 90% · audit 10%</text>
  <text x="326" y="304" font-size="11" fill="#8B949E" text-anchor="middle">cooperative helping</text>
  <text x="326" y="326" font-size="11" fill="#8B949E" text-anchor="middle">Treiber object pool</text>

  <line x1="424" y1="280" x2="470" y2="280" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="447" y="266" font-size="10" fill="#8B949E" text-anchor="middle">drain</text>

  <!-- 7-stage pipeline -->
  <rect x="476" y="96" width="272" height="368" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="124" font-size="15" font-weight="700" fill="#00D4FF" text-anchor="middle">7-STAGE PIPELINE</text>

  <rect x="492" y="138" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="159" font-size="11" fill="#C9D1D9" text-anchor="middle">0 · PreFilter — rate, level policy</text>

  <rect x="492" y="180" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="201" font-size="11" fill="#C9D1D9" text-anchor="middle">1 · Filter — drop / pass rules</text>

  <rect x="492" y="222" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="243" font-size="11" fill="#C9D1D9" text-anchor="middle">2 · FieldProvider — inject fields</text>

  <rect x="492" y="264" width="240" height="34" fill="#161B22" stroke="#FF6B00" stroke-width="1"/>
  <text x="612" y="285" font-size="11" fill="#FF6B00" text-anchor="middle">3 · Assembly — LSN + Ed25519 + hash</text>

  <rect x="492" y="306" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="327" font-size="11" fill="#C9D1D9" text-anchor="middle">4 · Processing — CRC32C, secrets</text>

  <rect x="492" y="348" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="369" font-size="11" fill="#C9D1D9" text-anchor="middle">5 · Formatting — JSON / text</text>

  <rect x="492" y="390" width="240" height="34" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="612" y="411" font-size="11" fill="#C9D1D9" text-anchor="middle">6 · Sink fan-out</text>

  <line x1="748" y1="280" x2="794" y2="280" stroke="#00D4FF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="771" y="266" font-size="10" fill="#8B949E" text-anchor="middle">io_pool</text>

  <!-- Sink layer -->
  <rect x="800" y="212" width="216" height="136" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="908" y="246" font-size="15" font-weight="700" fill="#00D4FF" text-anchor="middle">SINK LAYER</text>

  <rect x="812" y="258" width="60" height="26" fill="#161B22" stroke="#FF6B00" stroke-width="1"/>
  <text x="842" y="275" font-size="11" fill="#FF6B00" text-anchor="middle">Kafka</text>

  <rect x="880" y="258" width="60" height="26" fill="#161B22" stroke="#00D4FF" stroke-width="1"/>
  <text x="910" y="275" font-size="11" fill="#00D4FF" text-anchor="middle">SQLite</text>

  <rect x="948" y="258" width="60" height="26" fill="#161B22" stroke="#C9D1D9" stroke-width="1"/>
  <text x="978" y="275" font-size="11" fill="#C9D1D9" text-anchor="middle">Stdout</text>

  <text x="908" y="312" font-size="11" fill="#8B949E" text-anchor="middle">+ 8 more: File · Syslog · Webhook</text>
  <text x="908" y="328" font-size="11" fill="#8B949E" text-anchor="middle">WORM · Security · SHM · OTel · Callback</text>

  <text x="520" y="532" font-size="11" fill="#8B949E" text-anchor="middle">Audit records are Ed25519-signed at stage 3 and written to WORM storage — never dropped.</text>
</svg>
