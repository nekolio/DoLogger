<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="arch-title arch-desc" font-family="'Geist', ui-sans-serif, system-ui, sans-serif">
  <title id="arch-title">DoLogger pipeline architecture</title>
  <desc id="arch-desc">A record flows from an application through a lock-free ring into a seven-stage pipeline and out to a sink layer. Stage 3 assembles each audit record and signs it with Ed25519.</desc>

  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/>
    </marker>
  </defs>

  <!-- background (paper) -->
  <rect x="0" y="0" width="960" height="600" fill="#f5f5f5"/>

  <!-- ============ zones ============ -->
  <rect x="40" y="180" width="352" height="248" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="184" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="216" y="196" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="7" font-weight="500" letter-spacing="0.14em" fill="rgba(45,49,66,0.40)" text-anchor="middle">INGEST</text>

  <rect x="400" y="60" width="268" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="476" y="64" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="532" y="76" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="7" font-weight="500" letter-spacing="0.14em" fill="rgba(45,49,66,0.40)" text-anchor="middle">7-STAGE PIPELINE</text>

  <rect x="700" y="160" width="220" height="256" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="768" y="164" width="80" height="12" rx="2" fill="#f5f5f5"/>
  <text x="808" y="176" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="7" font-weight="500" letter-spacing="0.14em" fill="rgba(45,49,66,0.40)" text-anchor="middle">SINK LAYER</text>

  <!-- ============ arrows (before boxes) ============ -->
  <line x1="180" y1="296" x2="224" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="180" y="276" width="40" height="16" rx="2" fill="#f5f5f5"/>
  <text x="200" y="288" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">push</text>

  <line x1="376" y1="296" x2="400" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="372" y="276" width="32" height="16" rx="2" fill="#f5f5f5"/>
  <text x="388" y="288" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">drain</text>

  <line x1="668" y1="288" x2="700" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
  <rect x="664" y="268" width="40" height="16" rx="2" fill="#f5f5f5"/>
  <text x="684" y="280" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75" text-anchor="middle">io_pool</text>

  <!-- ============ INGEST nodes ============ -->
  <rect x="52" y="240" width="128" height="112" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="116" y="272" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">APPLICATION</text>
  <text x="116" y="296" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">dologger_log()</text>
  <text x="116" y="316" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Rust SDK · C ABI</text>
  <text x="116" y="336" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Py · Go adapters</text>

  <rect x="224" y="240" width="152" height="112" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="300" y="272" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">LOCK-FREE RING</text>
  <text x="300" y="296" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">MPSC · CAS push</text>
  <text x="300" y="316" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">normal 90% · audit 10%</text>
  <text x="300" y="336" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Treiber object pool</text>

  <!-- ============ pipeline stages ============ -->
  <rect x="412" y="120" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="136" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">0 · PreFilter</text>
  <text x="532" y="148" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">rate · level policy</text>

  <rect x="412" y="168" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="184" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">1 · Filter</text>
  <text x="532" y="196" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">drop / pass rules</text>

  <rect x="412" y="216" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="232" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">2 · FieldProvider</text>
  <text x="532" y="244" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">inject fields</text>

  <!-- focal stage -->
  <rect x="412" y="264" width="240" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="532" y="280" font-size="9" font-weight="600" fill="#eb6c36" text-anchor="middle">3 · Assembly</text>
  <text x="532" y="292" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">LSN + Ed25519 + hash</text>

  <rect x="412" y="312" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="328" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">4 · Processing</text>
  <text x="532" y="340" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">CRC32C · secrets</text>

  <rect x="412" y="360" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="376" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">5 · Formatting</text>
  <text x="532" y="388" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">JSON / text</text>

  <rect x="412" y="408" width="240" height="40" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="532" y="424" font-size="9" font-weight="600" fill="#2d3142" text-anchor="middle">6 · Sink fan-out</text>
  <text x="532" y="436" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">route records</text>

  <!-- ============ SINK nodes ============ -->
  <rect x="708" y="220" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="740" y="244" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">Kafka</text>

  <rect x="776" y="220" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="808" y="244" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">SQLite</text>

  <rect x="844" y="220" width="64" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="876" y="244" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">Stdout</text>

  <text x="808" y="300" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">+ 8 more: File · Syslog · Webhook</text>
  <text x="808" y="316" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="8" fill="#4f5d75" text-anchor="middle">WORM · Security · SHM · OTel · Callback</text>

  <!-- ============ legend strip ============ -->
  <text x="480" y="576" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-size="9" fill="#4f5d75" text-anchor="middle">Audit records are Ed25519-signed at stage 3 and written to WORM storage — never dropped.</text>
</svg>
