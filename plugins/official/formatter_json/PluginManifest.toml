# formatter_json — Official DoLogger Formatter Plugin
#
# Serializes log records to structured JSON with configurable field inclusion.
# Phase: Formatting (5), Trust: Blue

[plugin]
name = "formatter-json"
version = "0.0.1"
plugin_type = "formatter"
mount_phase = ["format"]
abi_version = 1
min_core_abi = "0.0.1"
description = "Serialize log records to structured JSON with configurable field inclusion."

[plugin.trust]
color = "blue"

[plugin.author]
name = "DoLogger Core Team"
email = "nekoliowork+DoLogger@gmail.com"
url = "https://github.com/Nekolio/DoLogger"

[capabilities]
file_read = false
file_write = false
network = false
process_create = false

[licenses]
spdx = "Apache-2.0 OR MIT"
